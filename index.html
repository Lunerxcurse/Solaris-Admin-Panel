<!DOCTYPE html><html lang="en" class="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Solaris Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-base: #090a0f;
    --bg-surface: #12141a;
    --bg-surface-elevated: #181b24;
    --bg-surface-hover: #1f232e;
    --border: #232733;
    --border-light: #2c3242;
    --text-primary: #f1f3f9;
    --text-secondary: #949eb5;
    --text-muted: #626d84;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-subtle: rgba(59, 130, 246, 0.12);
    --danger: #ef4444;
    --danger-subtle: rgba(239, 68, 68, 0.14);
    --danger-border: rgba(239, 68, 68, 0.35);
    --warning: #f59e0b;
    --warning-subtle: rgba(245, 158, 11, 0.14);
    --warning-border: rgba(245, 158, 11, 0.35);
    --success: #10b981;
    --success-subtle: rgba(16, 185, 129, 0.14);
    --purple: #a855f7;
    --purple-subtle: rgba(168, 85, 247, 0.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Login view */
  #login-card {
    max-width: 380px;
    margin: 120px auto 0;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.5);
  }
  .brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .brand-header h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .login-desc {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: -14px 0 22px;
  }
  #login-card input {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text-primary);
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 3px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #login-card input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-subtle);
  }
  #login-card button {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    transition: background-color 0.15s ease;
  }
  #login-card button:hover { background: var(--primary-hover); }
  #login-card button:disabled { opacity: 0.5; cursor: not-allowed; }
  #login-error {
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-top: 12px;
    text-align: center;
    font-weight: 500;
  }

  /* App Layout & Header */
  #dash { display: none; }
  .badge-online {
    font-size: 11px;
    font-weight: 600;
    color: var(--success);
    background: var(--success-subtle);
    border: 1px solid var(--success-subtle);
    border-radius: 6px;
    padding: 2px 7px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .badge-online .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
  }

  .main-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* Stats and Section header */
  .page-header {
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
  }
  .page-header h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .page-header p {
    color: var(--text-secondary);
    font-size: 13.5px;
    margin: 0;
  }
  .page-header code {
    font-family: 'JetBrains Mono', monospace;
    background: var(--bg-surface);
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 12px;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  .search-wrap i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }
  #search {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px 10px 38px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.15s ease;
  }
  #search:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-subtle);
  }
  .toolbar-meta {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .toolbar-meta-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* User Cards / Rows */
  .user-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 10px;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }
  .user-card:hover {
    border-color: var(--border-light);
    background: var(--bg-surface-elevated);
  }
  .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .who {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }
  .avatar-box {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-surface-hover);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--text-secondary);
    position: relative;
    flex-shrink: 0;
  }
  .avatar-box .avatar-clip {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-box .avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .status-indicator {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--bg-surface);
    background: var(--text-muted);
    z-index: 1;
  }
  .status-indicator.online {
    background: var(--success);
    box-shadow: 0 0 0 1px var(--success-subtle);
  }
  .status-indicator.offline {
    background: var(--text-muted);
  }

  .user-info {
    min-width: 0;
  }
  .uname-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .uname {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--text-primary);
  }
  .uemail {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
    word-break: break-all;
  }
  .badges {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .badge.banned {
    background: var(--danger-subtle);
    color: #f87171;
    border: 1px solid var(--danger-border);
  }
  .badge.warncount {
    background: var(--bg-base);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  /* Actions */
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .actions button {
    border: 1px solid var(--border);
    background: var(--bg-base);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .actions button:hover {
    background: var(--bg-surface-hover);
    border-color: var(--border-light);
  }
  .actions button.icon-btn {
    padding: 8px 10px;
    color: var(--text-secondary);
  }
  .actions button.icon-btn:hover {
    color: var(--text-primary);
  }
  .actions button.warn {
    color: #fbbf24;
    border-color: rgba(251, 191, 36, 0.25);
  }
  .actions button.warn:hover {
    background: var(--warning-subtle);
    border-color: var(--warning-border);
  }
  .actions button.ban {
    color: #f87171;
    border-color: rgba(248, 113, 113, 0.25);
  }
  .actions button.ban:hover {
    background: var(--danger-subtle);
    border-color: var(--danger-border);
  }
  .actions button.ban.active {
    background: var(--danger-subtle);
    border-color: var(--danger-border);
    color: #fca5a5;
  }
  .actions button.troll {
    color: #c084fc;
    border-color: rgba(192, 132, 252, 0.25);
  }
  .actions button.troll:hover {
    background: var(--purple-subtle);
    border-color: rgba(192, 132, 252, 0.4);
  }
  .actions button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* Troll dropdown menu */
  .troll-wrap { position: relative; }
  .troll-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 50;
    min-width: 200px;
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6);
  }
  .troll-menu.open { display: block; }
  .troll-menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-primary);
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
  }
  .troll-menu button:hover {
    background: var(--bg-surface-hover);
  }

  /* Empty and Loading states */
  #empty, #loading {
    text-align: center;
    color: var(--text-secondary);
    padding: 60px 20px;
    font-size: 14px;
    background: var(--bg-surface);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--primary);
    border-right-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 1.6s; }
  }

  /* Modals */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal-overlay.open {
    display: flex;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-card {
    width: 100%;
    max-width: 400px;
    background: var(--bg-surface);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  #data-modal .modal-card {
    max-width: 640px;
  }
  .modal-card h2 {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .modal-card .modal-sub {
    color: var(--text-secondary);
    font-size: 13px;
    margin: 0 0 18px;
    word-break: break-all;
    line-height: 1.4;
  }
  .modal-card label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .modal-card select,
  .modal-card input[type="text"] {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.15s ease;
  }
  .modal-card select:focus,
  .modal-card input[type="text"]:focus {
    border-color: var(--primary);
  }
  #data-json {
    width: 100%;
    min-height: 340px;
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text-primary);
    font-size: 12.5px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    resize: vertical;
    white-space: pre;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .modal-actions button {
    border: 1px solid var(--border);
    background: var(--bg-base);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .modal-actions button:hover {
    background: var(--bg-surface-hover);
    border-color: var(--border-light);
  }
  .modal-actions button.confirm {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .modal-actions button.confirm:hover {
    background: #dc2626;
  }
  .modal-actions button.confirm-warn {
    background: var(--warning);
    border-color: var(--warning);
    color: #1a1200;
  }
  .modal-actions button.confirm-warn:hover {
    background: #d97706;
  }
  .modal-actions button:disabled { opacity: .5; cursor: not-allowed; }
</style>
<style>.troll-menu button[data-troll-nav="root"] { display: flex !important; align-items: center !important; justify-content: flex-start !important; gap: 6px !important; text-align: left !important; width: 100% !important; margin: 0 !important; } .troll-menu button[data-troll-nav="root"] i { margin-right: 0 !important; font-size: 11px; }</style></head>
<body>

<!-- Login View -->
<div id="login-card">
  <div class="brand-header">
    <h1 class="">Solaris Admin</h1>
  </div>
  <p class="login-desc">Enter authorization code to access the management portal.</p>
  <input id="li-code" type="password" placeholder="Access code" autocomplete="off">
  <button id="li-btn" class="">Enter Dashboard</button>
  <div id="login-error"></div>
</div>

<!-- Dashboard View -->
<div id="dash">
  <main class="main-wrap">
    <div class="page-header">
      <div>
        <h2 class="">User Management</h2>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="Search by username or email…">
      </div>
      <div class="toolbar-meta-group">
        <div class="toolbar-meta" id="account-count"></div>
        <span class="badge-online" id="online-count-badge"><span class="dot"></span><span id="online-count-text">0 Online</span></span>
      </div>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div class="">Loading accounts…</div>
    </div>
    <div id="empty" style="display:none;" class="">No accounts matched your search query.</div>
    <div id="list"></div>
  </main>
</div>

<!-- Ban Modal -->
<div class="modal-overlay" id="ban-modal">
  <div class="modal-card">
    <h2 class="">Ban User</h2>
    <p class="modal-sub" id="ban-modal-who"></p>
    <label for="ban-duration" class="">Duration</label>
    <select id="ban-duration">
      <option value="1h">1 hour</option>
      <option value="3h">3 hours</option>
      <option value="1d">1 day</option>
      <option value="3d">3 days</option>
      <option value="1w">1 week</option>
      <option value="2w">2 weeks</option>
      <option value="1mo">1 month</option>
      <option value="2mo">2 months</option>
      <option value="permanent">Permanent</option>
    </select>
    <label for="ban-reason" class="">Reason (required)</label>
    <input id="ban-reason" type="text" placeholder="Specify suspension rationale…" autocomplete="off">
    <div id="ban-reason-error" style="display:none; color:#f87171; font-size:12px; margin:-12px 0 14px; font-weight:500;" class="">A reason is required.</div>
    <div class="modal-actions">
      <button id="ban-cancel-btn" type="button" class="">Cancel</button>
      <button id="ban-confirm-btn" class="confirm" type="button">Apply Ban</button>
    </div>
  </div>
</div>

<!-- Warn Modal -->
<div class="modal-overlay" id="warn-modal">
  <div class="modal-card">
    <h2 class="">Issue Warning</h2>
    <p class="modal-sub" id="warn-modal-who"></p>
    <label for="warn-reason" class="">Reason (required)</label>
    <input id="warn-reason" type="text" placeholder="Specify notice or violation…" autocomplete="off">
    <div id="warn-reason-error" style="display:none; color:#f87171; font-size:12px; margin:-12px 0 14px; font-weight:500;" class="">A reason is required.</div>
    <div class="modal-actions">
      <button id="warn-cancel-btn" type="button" class="">Cancel</button>
      <button id="warn-confirm-btn" class="confirm-warn" type="button">Send Warning</button>
    </div>
  </div>
</div>

<!-- Data Inspection Modal -->
<div class="modal-overlay" id="data-modal">
  <div class="modal-card">
    <h2 class="">Account Data Snapshot</h2>
    <p class="modal-sub" id="data-modal-who"></p>
    <label for="data-json" class="">Synced local storage snapshot (read-only)</label>
    <textarea id="data-json" spellcheck="false" readonly=""></textarea>
    <div id="data-json-error" style="display:none; color:#f87171; font-size:12px; margin:0 0 10px;" class="">Could not load data.</div>
    <div class="modal-actions">
      <button id="data-cancel-btn" type="button" class="">Close</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://vdoovrjuwuclrgtcoxkd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_YAMzS7O3xYrWaFsld8viFQ_Pv0vyjRT';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let rows = [];
let accessCode = null;

const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadRows() {
  $('loading').style.display = 'block';
  $('list').innerHTML = '';
  const { data, error } = await sb.rpc('admin_list_accounts', { code: accessCode });
  $('loading').style.display = 'none';

  if (error) {
    console.warn('Solaris Admin: load failed', error);
    $('empty').textContent = 'Could not load accounts: ' + error.message;
    $('empty').style.display = 'block';
    return;
  }
  rows = data || [];
  render();
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const filtered = rows.filter(r => {
    if (!q) return true;
    const nameMatch = (r._profileName || r.username || '').toLowerCase().includes(q);
    const emailMatch = (r.email || '').toLowerCase().includes(q);
    return nameMatch || emailMatch;
  });
  $('empty').style.display = filtered.length ? 'none' : 'block';
  $('account-count').textContent = `${filtered.length} account${filtered.length === 1 ? '' : 's'}`;
  $('list').innerHTML = filtered.map(r => rowHtml(r)).join('');
  filtered.forEach(r => wireRow(r));
  refreshAllStatusDots();
  loadProfilesForVisibleRows();
}

// --------------------------------------------------------------------
// Live profile sync
// --------------------------------------------------------------------
// The account list (admin_list_accounts) only returns username/email/
// moderation fields — not the profile name/avatar the person actually
// picked on the profile-selector screen (that lives in the synced
// solaris_user blob inside solaris_app_data.data). We already have a
// per-user RPC that can read that blob (admin_get_user_data, used by the
// Inspect Data modal), so reuse it here instead of needing a new one:
// fetch it for every row currently on screen and patch the card in
// place. A postgres_changes subscription on solaris_app_data then keeps
// each card current the moment that account's row changes (e.g. they
// rename themselves or pick a new avatar in Settings), with a periodic
// re-poll as a fallback in case realtime isn't enabled for that table.

const profileFetchInFlight = new Set();

async function loadProfilesForVisibleRows() {
  const cards = document.querySelectorAll('.user-card[data-uid]');
  cards.forEach(card => refreshProfileFor(card.dataset.uid));
}

async function refreshProfileFor(userId) {
  if (!userId || profileFetchInFlight.has(userId)) return;
  profileFetchInFlight.add(userId);
  try {
    const { data, error } = await sb.rpc('admin_get_user_data', { code: accessCode, target_user_id: userId });
    if (error) {
      console.warn('Solaris Admin: profile fetch failed for', userId, error);
      return;
    }
    let profile = null;
    try {
      const raw = data && data.solaris_user;
      profile = raw ? JSON.parse(raw) : null;
    } catch (e) {}
    applyProfileToRow(userId, profile);
  } catch (e) {
    console.warn('Solaris Admin: profile fetch error for', userId, e);
  } finally {
    profileFetchInFlight.delete(userId);
  }
}

function applyProfileToRow(userId, profile) {
  const row = rows.find(r => r.user_id === userId);
  if (!row) return;
  const name = (profile && profile.name) ? String(profile.name).trim() : '';
  const avatar = (profile && profile.avatar) ? String(profile.avatar) : '';
  if (row._profileName === name && row._profileAvatar === avatar) return; // no change
  row._profileName = name;
  row._profileAvatar = avatar;

  const card = document.querySelector(`.user-card[data-uid="${userId}"]`);
  if (!card) return; // row may have been filtered out by search since

  const displayName = name || row.username || '(no username set)';
  const unameEl = card.querySelector('[data-uname]');
  if (unameEl) unameEl.textContent = displayName;

  const initialsEl = card.querySelector('.avatar-initials');
  const imgEl = card.querySelector('[data-avatar-img]');
  if (avatar) {
    if (imgEl) { imgEl.src = avatar; imgEl.style.display = ''; }
    if (initialsEl) initialsEl.style.display = 'none';
  } else {
    if (imgEl) { imgEl.style.display = 'none'; imgEl.removeAttribute('src'); }
    if (initialsEl) {
      initialsEl.textContent = (displayName.replace(/[^a-zA-Z0-9]/g, '').slice(0, 2) || 'U').toUpperCase();
      initialsEl.style.display = '';
    }
  }
}

let profileChangesChannel = null;
function initProfileChangeSubscription() {
  profileChangesChannel = sb
    .channel('admin-profile-changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'solaris_app_data' }, (payload) => {
      const userId = payload && payload.new && payload.new.user_id;
      if (userId) refreshProfileFor(userId);
    })
    .subscribe();
}
initProfileChangeSubscription();

// Fallback in case realtime isn't enabled for solaris_app_data on this
// project — without this, profile edits would only ever show up after
// an admin action (ban/warn/etc.) triggers the next loadRows().
setInterval(loadProfilesForVisibleRows, 30000);

function refreshAllStatusDots() {
  document.querySelectorAll('[data-status-dot]').forEach(dot => {
    const uid = dot.dataset.statusDot;
    const isOnline = onlineUserIds.has(uid);
    dot.classList.toggle('online', isOnline);
    dot.classList.toggle('offline', !isOnline);
    dot.title = isOnline ? 'Online' : 'Offline';
  });
  const countEl = $('online-count-text');
  if (countEl) countEl.textContent = `${onlineUserIds.size} Online`;
}

initPresenceTracking();

function wireRow(r) {
  const card = document.querySelector(`.user-card[data-uid="${r.user_id}"]`);
  if (!card) return;

  const trollBtn = card.querySelector('button[data-act="troll"]');
  const trollWrap = card.querySelector('.troll-wrap');
  const trollMenus = card.querySelectorAll('.troll-menu');
  const rootMenu = card.querySelector('.troll-menu[data-menu="root"]');
  const soundsMenu = card.querySelector('.troll-menu[data-menu="sounds"]');
  const jumpscaresMenu = card.querySelector('.troll-menu[data-menu="jumpscares"]');
  const effectsMenu = card.querySelector('.troll-menu[data-menu="effects"]');

  function showTrollMenu(which) {
    trollMenus.forEach(m => m.classList.toggle('open', m === which));
  }

  if (trollBtn && rootMenu) {
    trollBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const wasOpen = [...trollMenus].some(m => m.classList.contains('open'));
      document.querySelectorAll('.troll-menu.open').forEach(m => m.classList.remove('open'));
      if (!wasOpen) showTrollMenu(rootMenu);
    });

    const navTargets = { sounds: soundsMenu, jumpscares: jumpscaresMenu, effects: effectsMenu, root: rootMenu };
    trollWrap.querySelectorAll('button[data-troll-nav]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const target = navTargets[item.dataset.trollNav] || rootMenu;
        showTrollMenu(target);
      });
    });

    trollWrap.querySelectorAll('button[data-jumpscare]').forEach(item => {
      item.addEventListener('click', async (e) => {
        e.stopPropagation();
        const kind = item.dataset.jumpscare;
        const original = item.textContent;
        item.disabled = true;
        item.textContent = 'Sending…';
        try {
          await sendJumpscare(r.user_id, kind);
          item.disabled = false;
          item.textContent = original;
        } catch (err) {
          item.textContent = 'Could Not Send';
          window.setTimeout(() => {
            item.disabled = false;
            item.textContent = original;
          }, 1500);
        }
      });
    });
  }

  card.querySelectorAll('button[data-act]').forEach(btn => {
    if (btn.dataset.act === 'troll') return;
    btn.addEventListener('click', async () => {
      const act = btn.dataset.act;
      btn.disabled = true;
      try {
        if (act === 'data') {
          openDataModal(r, btn);
          return;
        }
        if (act === 'warn') {
          openWarnModal(r, btn);
          return;
        }
        if (act === 'ban') {
          if (r.banned) {
            await call('admin_unban_user', { code: accessCode, target_user_id: r.user_id });
          } else {
            openBanModal(r, btn);
            return;
          }
        }
        await loadRows();
      } catch (e) {
        alert('Action failed: ' + (e.message || 'unknown error'));
        btn.disabled = false;
      }
    });
  });
}

async function call(fn, args) {
  const { error } = await sb.rpc(fn, args);
  if (error) throw error;
}

function sendJumpscare(targetUserId, kind) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const channel = sb.channel('jumpscare:' + targetUserId, { config: { broadcast: { self: false } } });
    const timeout = setTimeout(() => {
      if (settled) return;
      settled = true;
      try { sb.removeChannel(channel); } catch (e) {}
      reject(new Error('Timed out — user may be offline.'));
    }, 6000);

    channel.subscribe((status) => {
      if (settled || status !== 'SUBSCRIBED') return;
      channel.send({ type: 'broadcast', event: 'trigger', payload: { type: kind } })
        .then(() => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          setTimeout(() => { try { sb.removeChannel(channel); } catch (e) {} }, 500);
          resolve();
        })
        .catch((err) => {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          try { sb.removeChannel(channel); } catch (e) {}
          reject(err);
        });
    });
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.troll-menu.open').forEach(m => m.classList.remove('open'));
});

let banCtx = null;
function openBanModal(r, btn) {
  banCtx = { r, btn };
  $('ban-modal-who').textContent = `Choose duration and specify reasons for ${r.username || r.email}.`;
  $('ban-duration').value = '1h';
  $('ban-reason').value = '';
  $('ban-reason-error').style.display = 'none';
  $('ban-modal').classList.add('open');
  $('ban-duration').focus();
}

function closeBanModal(reenableBtn) {
  if (reenableBtn && banCtx) banCtx.btn.disabled = false;
  banCtx = null;
  $('ban-modal').classList.remove('open');
}

$('ban-cancel-btn').addEventListener('click', () => closeBanModal(true));
$('ban-modal').addEventListener('click', (e) => { if (e.target === $('ban-modal')) closeBanModal(true); });

$('ban-confirm-btn').addEventListener('click', async () => {
  if (!banCtx) return;
  const { r } = banCtx;
  const duration = $('ban-duration').value;
  const reason = $('ban-reason').value.trim();
  if (!reason) {
    $('ban-reason-error').style.display = 'block';
    $('ban-reason').focus();
    return;
  }
  $('ban-reason-error').style.display = 'none';
  $('ban-confirm-btn').disabled = true;
  try {
    await call('admin_ban_user', { code: accessCode, target_user_id: r.user_id, duration, reason });
    closeBanModal(false);
    await loadRows();
  } catch (e) {
    alert('Action failed: ' + (e.message || 'unknown error'));
    if (banCtx) banCtx.btn.disabled = false;
  } finally {
    $('ban-confirm-btn').disabled = false;
  }
});

let dataCtx = null;
async function openDataModal(r, btn) {
  dataCtx = { r, btn };
  $('data-modal-who').textContent = `${r.username || r.email} — Synced local storage state snapshot.`;
  $('data-json').value = 'Loading snapshot…';
  $('data-json-error').style.display = 'none';
  $('data-modal').classList.add('open');

  const { data, error } = await sb.rpc('admin_get_user_data', { code: accessCode, target_user_id: r.user_id });
  if (!dataCtx || dataCtx.r.user_id !== r.user_id) return;

  if (error) {
    $('data-json').value = '';
    $('data-json-error').textContent = 'Could not load: ' + (error.message || 'unknown error');
    $('data-json-error').style.display = 'block';
    return;
  }
  $('data-json').value = JSON.stringify(data || {}, null, 2);
}

function closeDataModal(reenableBtn) {
  if (reenableBtn && dataCtx) dataCtx.btn.disabled = false;
  dataCtx = null;
  $('data-modal').classList.remove('open');
}

$('data-cancel-btn').addEventListener('click', () => closeDataModal(true));
$('data-modal').addEventListener('click', (e) => { if (e.target === $('data-modal')) closeDataModal(true); });

$('search').addEventListener('input', render);

$('li-btn').addEventListener('click', doLogin);
$('li-code').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  $('login-error').textContent = '';
  $('li-btn').disabled = true;
  const code = $('li-code').value.trim();
  const { error } = await sb.rpc('admin_list_accounts', { code });
  $('li-btn').disabled = false;
  if (error) { $('login-error').textContent = 'Invalid access code.'; return; }
  accessCode = code;
  $('login-card').style.display = 'none';
  $('dash').style.display = 'block';
  loadRows();
}
